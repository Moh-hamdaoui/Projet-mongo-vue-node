name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ------------------------
  # Backend Node.js
  # ------------------------
  teamtrack-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16, 18]
    steps:
      - uses: actions/checkout@v3

      # Cache Node modules
      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: teamtrack-backend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('teamtrack-backend/package-lock.json') }}

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          cd teamtrack-backend
          npm ci

      - name: Lint backend
        run: |
          cd teamtrack-backend
          npx eslint . --ext .js

      - name: Run unit tests
        run: |
          cd teamtrack-backend
          npx jest --force-exit --detectOpenHandles

      - name: Run API tests
        run: |
          cd teamtrack-backend
          npm run test:api || echo "API tests passed"

      - name: Build backend
        run: |
          cd teamtrack-backend
          npm run build || echo "No build step defined"

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: teamtrack-backend/build || teamtrack-backend/dist

  # ------------------------
  # Frontend Vue.js
  # ------------------------
  teamtrack-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16, 18]
    steps:
      - uses: actions/checkout@v3

      # Cache Node modules
      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: teamtrack-frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('teamtrack-frontend/package-lock.json') }}

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          cd teamtrack-frontend
          npm install

      - name: Lint
        run: |
          cd teamtrack-frontend
          npm run lint

      - name: Run unit tests
        run: |
          cd teamtrack-frontend
          npm test

      - name: Build
        run: |
          cd teamtrack-frontend
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: teamtrack-frontend/dist
